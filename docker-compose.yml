# Tomcat 10.1 (Jakarta EE 10) qui sert le WAR du projet a la racine "/".
#
# Workflow :
#   1. mvn clean package   -> genere (openapi-generator) + compile => target/app.war
#   2. docker compose up    -> Tomcat depose le WAR en ROOT.war et le sert sur :8080
#
# On MONTE simplement target/app.war : pas d'image a rebuild a chaque iteration.
services:
  tomcat:
    image: tomcat:10.1-jdk21-temurin
    container_name: poc-api-first-openapi
    ports:
      - "8080:8080"
    volumes:
      # Le WAR construit par Maven, depose comme appli ROOT (servie sur "/").
      - ./target/app.war:/usr/local/tomcat/webapps/ROOT.war:ro
    restart: unless-stopped
